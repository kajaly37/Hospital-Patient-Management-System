{% extends "base.html" %}

{% block title %}Edit Patient{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Edit Patient</h1>

    <p>Update patient information.</p>


    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label>Patient Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ patient.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Age</label>

                <input
                    type="number"
                    name="age"
                    value="{{ patient.age }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Gender</label>

                <select name="gender" required>

                    <option value="Male"
                        {% if patient.gender == "Male" %}selected{% endif %}>
                        Male
                    </option>

                    <option value="Female"
                        {% if patient.gender == "Female" %}selected{% endif %}>
                        Female
                    </option>

                    <option value="Other"
                        {% if patient.gender == "Other" %}selected{% endif %}>
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    name="phone"
                    value="{{ patient.phone }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Blood Group</label>

                <input
                    type="text"
                    name="blood_group"
                    value="{{ patient.blood_group }}"
                >

            </div>


            <div class="form-group">

                <label>Disease / Condition</label>

                <input
                    type="text"
                    name="disease"
                    value="{{ patient.disease }}"
                >

            </div>


            <div class="form-group">

                <label>Admission Date</label>

                <input
                    type="date"
                    name="admission_date"
                    value="{{ patient.admission_date }}"
                    required
                >

            </div>

        </div>


        <div class="form-group full">

            <label>Address</label>

            <textarea
                name="address"
                rows="4"
            >{{ patient.address }}</textarea>

        </div>


        <div class="form-actions">

            <a href="{{ url_for('patients') }}" class="cancel-btn">
                Cancel
            </a>

            <button type="submit" class="btn">
                Update Patient
            </button>

        </div>

    </form>

</div>

{% endblock %}
